name: CI Full App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-migration-sql:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: scripts/sql
    steps:
      - uses: actions/checkout@v5
      - name: Valider les scripts SQL de migration
        shell: pwsh
        run: ./validate-migration-scripts.ps1 -SqlRoot ../../docs

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Run unit/integration tests
        run: npx jest --config jest.config.cjs --passWithNoTests --coverage
      - name: Upload Jest coverage report
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: frontend/coverage
      - name: Install Playwright Browsers
        run: npx playwright install --with-deps
      - name: Run frontend accessibility and E2E suite
        run: |
          set -euo pipefail

          nohup npm run dev -- --host 127.0.0.1 --port 5173 --strictPort > /tmp/vite.log 2>&1 &
          VITE_PID=$!

          cleanup() {
            kill "$VITE_PID" 2>/dev/null || true
          }

          trap cleanup EXIT

          npx wait-on --timeout 180000 tcp:5173
          npx pa11y http://127.0.0.1:5173 --standard WCAG2AA --reporter cli
          npx playwright test --reporter=list,html
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Dump Vite log on failure
        if: always()
        run: |
          if [ -f /tmp/vite.log ]; then
            echo "---- /tmp/vite.log ----"
            cat /tmp/vite.log
          fi
        shell: bash
      - name: Upload Playwright HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report

  test-backup-restore:
    runs-on: ubuntu-latest
    env:
      HAS_DB_CONNECTION_STRING: ${{ secrets.DB_CONNECTION_STRING != '' }}
    defaults:
      run:
        working-directory: scripts/sql
    steps:
      - uses: actions/checkout@v5
      - name: DB_CONNECTION_STRING absent - test ignoré
        if: env.HAS_DB_CONNECTION_STRING != 'true'
        run: echo "::notice::DB_CONNECTION_STRING n'est pas configuré. Le test backup/restore est ignoré."
      - name: Install PostgreSQL client
        if: env.HAS_DB_CONNECTION_STRING == 'true'
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Exécuter le test PowerShell backup/restore
        if: env.HAS_DB_CONNECTION_STRING == 'true'
        shell: pwsh
        run: ./test-backup-restore.ps1 -ConnectionString "${{ secrets.DB_CONNECTION_STRING }}" -Environment dev
      - name: Nettoyer les dumps temporaires
        if: always()
        shell: pwsh
        run: |
          if (Test-Path ../../infra/backups) {
            Get-ChildItem ../../infra/backups -Filter "*ci-backup-restore-test*.dump" -ErrorAction SilentlyContinue | Remove-Item -Force -ErrorAction SilentlyContinue
          }
