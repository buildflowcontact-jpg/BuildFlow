name: SQL Release Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - prod

jobs:
  run-release-gate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Verify DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set"
            exit 1
          fi

      - name: Run release gate SQL check
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/migration-release-gate-check.sql

      - name: Run integrity SQL check
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docs/migration-task-dependency-integrity-checks.sql
