name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

defaults:
  run:
    working-directory: frontend

jobs:
  # ──────────────────────────────────────────────
  # Job 1 : Lint + Tests unitaires Jest
  # ──────────────────────────────────────────────
  lint-and-test:
    name: Lint & Jest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests (Jest)
        run: npm run test -- --runInBand --ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jest-coverage
          path: frontend/coverage/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2 : Tests E2E Playwright (smoke uniquement)
  # ──────────────────────────────────────────────
  # Job 1b : Budget taille bundle (build + check)
  # ──────────────────────────────────────────────
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: placeholder
          VITE_SUPABASE_ANON_KEY: placeholder

      - name: Check bundle budgets
        run: node scripts/check-bundle-size.cjs

      - name: Upload bundle report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bundle-report
          path: frontend/bundle-report.html
          if-no-files-found: ignore
          retention-days: 7

  # ──────────────────────────────────────────────
  # Job 2 : Tests E2E Playwright (smoke uniquement)
  # Dépend de lint-and-test pour ne pas gâcher
  # les minutes CI si le lint/Jest est déjà rouge.
  # ──────────────────────────────────────────────
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: lint-and-test

    env:
      # Variables optionnelles pour activer le flow auth complet.
      # À définir dans Settings → Secrets & variables → Actions.
      E2E_USER_EMAIL: ${{ secrets.E2E_USER_EMAIL }}
      E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Build app
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      # Crée / réinitialise le compte de test E2E dans Supabase.
      # Exécuté uniquement si les secrets sont définis (sinon les tests auth sont skippés).
      - name: Seed E2E user
        if: ${{ env.SUPABASE_SERVICE_ROLE_KEY != '' && env.E2E_USER_EMAIL != '' && env.E2E_USER_PASSWORD != '' && env.VITE_SUPABASE_URL != '' }}
        run: node ../scripts/setup-e2e-user.js
        env:
          SUPABASE_URL: ${{ env.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          E2E_USER_EMAIL: ${{ env.E2E_USER_EMAIL }}
          E2E_USER_PASSWORD: ${{ env.E2E_USER_PASSWORD }}

      - name: Start preview server
        run: npx vite preview --port 5173 &
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Wait for server
        run: npx wait-on http://localhost:5173 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test --reporter=github
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test videos (failures only)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-videos
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 3
