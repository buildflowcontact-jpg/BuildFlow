version: 2
updates:
  - package-ecosystem: npm
    directory: "/frontend"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies
      - security
    groups:
      frontend-runtime:
        patterns:
          - "react*"
          - "@supabase/*"
          - "recharts"
          - "lucide-react"
      frontend-tooling:
        patterns:
          - "vite*"
          - "@vitejs/*"
          - "typescript"
          - "@typescript-eslint/*"
          - "eslint*"
          - "jest*"
          - "@testing-library/*"
          - "playwright"
          - "@playwright/*"
